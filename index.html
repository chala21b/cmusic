let currentIndex=-1;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(q=''){
 q=q.toLowerCase().trim();
 const matches=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q));
 document.getElementById('count').textContent=matches.length+' song'+(matches.length===1?'':'s');
 document.getElementById('list').innerHTML=matches.length?matches.map(s=>{
 const i=songs.indexOf(s), n=String(s.number).padStart(2,'0');
 const audio='audio/'+n+'.mp3';
 return `<tr>
 <td class="num">${esc(s.number)}</td>
 <td><div class="song" onclick="openSong(${i})">${esc(s.title)}</div><div class="artist">${esc(s.artist||'Artist not specified in source')}</div></td>
 <td><button class="btn lyricsBtn" onclick="openSong(${i})">🎤 Lyrics</button></td>
 <td><button class="btn audioBtn" onclick="playAudio(${i})">▶ Audio</button></td>
 <td>${s.musicUrl?`<button class="btn linkBtn" onclick="openExternal('${esc(s.musicUrl)}')">🎵 Original Music</button>`:'<button class="btn disabled" disabled>🎵 Not verified</button>'}</td>
 <td>${s.lyricsUrl?`<button class="btn linkBtn" onclick="openExternal('${esc(s.lyricsUrl)}')">📖 Lyrics Source</button>`:'<button class="btn disabled" disabled>📖 Not verified</button>'}</td>
 </tr>`;
 }).join(''):'<tr><td colspan="6"><div class="empty">No songs found.</div></td></tr>';
}

function openExternal(url){window.open(url,'_blank','noopener')}
function playAudio(i){openSong(i);setTimeout(()=>document.getElementById('player').play().catch(()=>{}),120)}

function openSong(i){
 currentIndex=i; const s=songs[i]; const n=String(s.number).padStart(2,'0');
 document.getElementById('home').style.display='none';
 document.getElementById('detail').style.display='block';
 document.getElementById('dtitle').textContent=s.title;
 document.getElementById('dartist').textContent=s.artist||'Artist not specified in source';

}
function showHome(){document.getElementById('player').pause();document.getElementById('detail').style.display='none';document.getElementById('home').style.display='block'}
document.getElementById('prev').onclick=()=>{if(currentIndex>0)openSong(currentIndex-1)};
document.getElementById('next').onclick=()=>{if(currentIndex<songs.length-1)openSong(currentIndex+1)};

render();
